
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <style>

        /* ESTILOS GENERALES */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        /* MENU DE NAVEGACION */
        nav {
            background-color: black;
            padding: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            font-weight: bold;
        }

        nav a:hover {
            color: red;
        }

        /* CONTENEDOR PRINCIPAL */
        .contacto-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* TITULO PRINCIPAL */
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }

        /* TEXTO INTRODUCTORIO */
        .intro-text {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        /* CAMPOS DEL FORMULARIO */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        /* BOTON DE ENVIAR */
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* CORREO ELECTRONICO ALTERNATIVO */
        .correo-alternativo {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .correo-alternativo p {
            color: #666;
            margin-bottom: 5px;
        }

        .correo-alternativo a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        .correo-alternativo a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <!-- MENU DE NAVEGACION -->
    <nav>
        <a href="../index.html">INICIO</a>
        <a href="artistas.html">ARTISTAS</a>
        <a href="combates.html">COMBATES</a>
        <a href="contacto.html">CONTACTO</a>
        <a href="entradas.html">ENTRADAS</a>
        <a href="formulario.html">FORMULARIO</a>
        <a href="preguntas.html">PREGUNTAS</a>
    </nav>

    <!-- CONTENEDOR PRINCIPAL DE CONTACTO -->
    <div class="contacto-container">

        <!-- TITULO -->
        <h1>CONTACTO</h1>

        <!-- TEXTO EXPLICATIVO -->
        <p class="intro-text">
            Si tienes alguna duda o quieres ponerte en contacto con nosotros,
            puedes hacerlo a traves de los siguientes medios.
        </p>

        <!-- FORMULARIO DE CONTACTO -->
        <form action="#" method="POST">

            <!-- CAMPO NOMBRE -->
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre"
                placeholder="Escribe tu nombre" required>
            </div>

            <!-- CAMPO CORREO ELECTRONICO -->
            <div class="form-group">
                <label for="correo">Correo electronico</label>
                <input type="email" id="correo" name="correo"
                placeholder="tucorreo@ejemplo.com" required>
            </div>

            <!-- CAMPO MENSAJE -->
            <div class="form-group">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje"
                placeholder="Escribe tu mensaje aqui..." required></textarea>
            </div>

            <!-- BOTON ENVIAR -->
            <button type="submit">ENVIAR</button>

        </form>

        <!-- CORREO ELECTRONICO ALTERNATIVO -->
        <div class="correo-alternativo">
            <p>Tambien puedes contactar con nosotros por correo electronico:</p>
            <a href="mailto:contacto@ejemplo.com">
                contacto@ejemplo.com
            </a>
        </div>

    </div>

</body>
</html>
