    <!-- CABECERA -->
    <div>
        <h1>LA VELADA DEL AÑO VI</h1>
        <p class="subtitulo">EL EVENTO DE BOXEO MÁS ESPERADO</p>
        <a href="#combates" class="boton">VER COMBATES</a>
    </div>


    <!-- COMBATES -->
    <div id="combates">

        <h2>LOS COMBATES</h2>

        <!-- PELEA ESTRELLA -->
        <div class="pelea-estrella">
            <img src="plex.jpg" alt="Plex" class="foto-luchador">
            <span>PLEX VS THEGREFG</span>
            <img src="thegrefg.jpg" alt="TheGrefg" class="foto-luchador">
        </div>

        <!-- OTROS COMBATES -->
        <div class="pelea">
            <img src="illojuan.jpg" alt="IlloJuan" class="foto-luchador">
            <span>IlloJuan VS AuronPlay</span>
            <img src="auronplay.jpg" alt="AuronPlay" class="foto-luchador">
        </div>

        <div class="pelea">
            <img src="rivers.jpg" alt="Rivers" class="foto-luchador">
            <span>Rivers VS AriGameplays</span>
            <img src="arigameplays.jpg" alt="AriGameplays" class="foto-luchador">
        </div>

        <div class="pelea">
            <img src="spursito.jpg" alt="Spursito" class="foto-luchador">
            <span>Spursito VS DJMario</span>
            <img src="djmario.jpg" alt="DJMario" class="foto-luchador">
        </div>

        <div class="pelea">
            <img src="gemita.jpg" alt="Gemita" class="foto-luchador">
            <span>Gemita VS Lola Lolita</span>
            <img src="lolalolita.jpg" alt="Lola Lolita" class="foto-luchador">
        </div>

    </div>


    <!-- FORMULARIO -->
    <div id="formulario">

        <h2>FORMULARIO DE LA VELADA</h2>

        <form>

            <label>Nombre:</label><br>
            <input type="text" name="nombre"><br>

            <label>Edad:</label><br>
            <input type="number" name="edad"><br>

            <label>Correo electrónico:</label><br>
            <input type="email" name="correo"><br>

            <label>Combate favorito:</label><br>

            <select name="combate">
                <option>PLEX VS THEGREFG</option>
                <option>IlloJuan VS AuronPlay</option>
                <option>Rivers VS AriGameplays</option>
                <option>Spursito VS DJMario</option>
                <option>Gemita VS Lola Lolita</option>
            </select><br>

            <label>¿Quién crees que ganará?</label><br>
            <input type="text" name="ganador"><br>

            <button type="submit">ENVIAR FORMULARIO</button>

        </form>

    </div>
